<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News | Pure Talent</title>
  <meta name="description" content="News, announcements, and hiring updates from Pure Talent Recruitment &amp; Manpower Supply.">
  <meta name="theme-color" content="#2e1409">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body data-page="news" data-title-key="titleNews">
  <div id="site-header"></div>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <h1 data-i18n="newsHeroTitle">News and updates</h1>
        <p data-i18n="newsHeroCopy"></p>
      </div>
    </section>

    <section class="page-main" id="newsPage">
      <div class="container">
        <div class="filters" id="newsFilters" role="group" data-i18n-aria="newsFilter"></div>
        <div id="newsFeatured"></div>
        <div class="news-grid" id="newsGrid"></div>
        <p class="status-line" id="newsStatus" role="status" hidden></p>
        <div class="load-more"><button type="button" class="btn btn-outline" id="newsMore" hidden></button></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="assets/js/config.js"></script>
  <script defer src="assets/js/icons.js"></script>
  <script defer src="assets/js/i18n.js"></script>
  <script defer src="assets/js/data.js"></script>
  <script defer src="assets/js/core.js"></script>
  <script defer src="assets/js/news.js"></script>
  <script defer src="assets/js/chatbot.js"></script>
</body>
</html>
