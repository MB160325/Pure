<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our team | Pure Talent</title>
  <meta name="description" content="Meet the Pure Talent Recruitment &amp; Manpower Supply leadership team.">
  <meta name="theme-color" content="#2e1409">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body data-page="team" data-title-key="titleTeam">
  <div id="site-header"></div>

  <main id="main">
    <section class="page-hero has-image">
      <div class="page-bg" aria-hidden="true"><img src="assets/images/photos/team-group.jpg" alt="" onerror="this.remove()"></div>
      <div class="container">
        <h1 data-i18n="teamHeroTitle">Leadership with discipline, empathy, and market insight.</h1>
        <p data-i18n="teamHeroCopy"></p>
      </div>
    </section>

    <section class="page-main">
      <div class="container">
        <div class="section-head">
          <h2 class="section-title" data-i18n="teamIntroTitle">A team built around trust and delivery.</h2>
          <p class="section-copy" data-i18n="teamIntroCopy"></p>
        </div>
        <div class="team-grid" id="teamList"></div>
        <div class="values">
          <div class="value"><span class="ico" data-icon="shield-check"></span><h3 data-i18n="teamValueOneTitle"></h3><p data-i18n="teamValueOneCopy"></p></div>
          <div class="value"><span class="ico" data-icon="messages-square"></span><h3 data-i18n="teamValueTwoTitle"></h3><p data-i18n="teamValueTwoCopy"></p></div>
          <div class="value"><span class="ico" data-icon="target"></span><h3 data-i18n="teamValueThreeTitle"></h3><p data-i18n="teamValueThreeCopy"></p></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="assets/js/config.js"></script>
  <script defer src="assets/js/icons.js"></script>
  <script defer src="assets/js/i18n.js"></script>
  <script defer src="assets/js/data.js"></script>
  <script defer src="assets/js/core.js"></script>
  <script defer src="assets/js/team.js"></script>
  <script defer src="assets/js/chatbot.js"></script>
</body>
</html>
