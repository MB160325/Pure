<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start your business in the UAE | Pure Talent</title>
  <meta name="description" content="Want to start a business in the UAE from anywhere in the world? Share your idea with Pure Talent and we will help you take it from plan to launch.">
  <meta name="theme-color" content="#2e1409">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body data-page="startup" data-title-key="titleStartup">
  <div id="site-header"></div>

  <main id="main">
    <section class="su-hero" aria-labelledby="suH1">
      <div class="su-hero-bg" aria-hidden="true"><img src="assets/images/photos/meeting-boardroom.jpg" alt="" fetchpriority="high" onerror="this.remove()"></div>
      <div class="container su-hero-inner">
        <p class="hero-eyebrow" data-i18n="suEyebrow">Business setup support</p>
        <h1 id="suH1" data-i18n="suHeroTitle">Start your business in the UAE.</h1>
        <p class="su-lede" data-i18n="suHeroCopy"></p>
        <div class="su-cta-wrap">
          <button type="button" class="su-cta" data-open-startup><span class="su-cta-label"><span class="ico flip-rtl" data-icon="send"></span><span data-i18n="suCta">Apply now</span></span></button>
          <p class="su-note" data-i18n="suCtaNote"></p>
        </div>
      </div>
    </section>

    <section class="section" aria-labelledby="suStepsT">
      <div class="container">
        <div class="section-head"><h2 class="section-title" id="suStepsT" data-i18n="suStepsTitle">How we work with you</h2></div>
        <ol class="su-steps">
          <li><span class="su-num" aria-hidden="true">1</span><h3 data-i18n="suStep1T"></h3><p data-i18n="suStep1C"></p></li>
          <li><span class="su-num" aria-hidden="true">2</span><h3 data-i18n="suStep2T"></h3><p data-i18n="suStep2C"></p></li>
          <li><span class="su-num" aria-hidden="true">3</span><h3 data-i18n="suStep3T"></h3><p data-i18n="suStep3C"></p></li>
        </ol>
      </div>
    </section>

    <section class="section section-paper" aria-labelledby="suWhyT">
      <div class="container">
        <div class="section-head"><h2 class="section-title" id="suWhyT" data-i18n="suWhyTitle">Why Pure Talent</h2></div>
        <div class="values">
          <div class="value"><span class="ico" data-icon="map-pin"></span><h3 data-i18n="suWhy1T"></h3><p data-i18n="suWhy1C"></p></div>
          <div class="value"><span class="ico" data-icon="users"></span><h3 data-i18n="suWhy2T"></h3><p data-i18n="suWhy2C"></p></div>
          <div class="value"><span class="ico" data-icon="globe"></span><h3 data-i18n="suWhy3T"></h3><p data-i18n="suWhy3C"></p></div>
        </div>
      </div>
    </section>

    <section class="section section-dark su-final">
      <div class="container su-final-inner">
        <h2 class="section-title" data-i18n="suFinalTitle">Ready to start?</h2>
        <p class="section-copy" data-i18n="suFinalCopy"></p>
        <div class="su-cta-wrap">
          <button type="button" class="su-cta" data-open-startup><span class="su-cta-label"><span class="ico flip-rtl" data-icon="send"></span><span data-i18n="suCta">Apply now</span></span></button>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="assets/js/config.js"></script>
  <script defer src="assets/js/icons.js"></script>
  <script defer src="assets/js/i18n.js"></script>
  <script defer src="assets/js/data.js"></script>
  <script defer src="assets/js/core.js"></script>
  <script defer src="assets/js/chatbot.js"></script>
</body>
</html>
